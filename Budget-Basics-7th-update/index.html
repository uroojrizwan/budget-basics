<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetBasics - Learn Budgeting the Easy Way</title>
    <meta
      name="description"
      content="BudgetBasics is an educational platform that teaches students budgeting through simple guides, interactive calculators and visual learning."
    />
    <meta name="theme-color" content="#1e6b3d" />

    <!-- Apply the saved theme before first paint so dark mode never flashes light -->
    <script>
      try {
        var t = localStorage.getItem('bb_theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>

    <!-- Self-hosted font: no third-party request, no render-blocking stylesheet -->
    <link rel="preload" href="/fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-sans-3-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Source Sans 3';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/source-sans-3-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Sans 3';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/source-sans-3-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Sans 3';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/source-sans-3-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Sans 3';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/source-sans-3-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Sans 3';
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url('/fonts/source-sans-3-latin-800-normal.woff2') format('woff2');
      }
      /* Metric-matched fallback so text doesn't jump when the web font swaps in */
      @font-face {
        font-family: 'Source Sans Fallback';
        src: local('Arial'), local('Helvetica Neue'), local('Helvetica');
        size-adjust: 93%;
        ascent-override: 110%;
        descent-override: 43%;
        line-gap-override: 0%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
